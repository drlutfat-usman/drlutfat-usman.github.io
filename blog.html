<header class="site">
  <nav class="nav">

    <ul>

<main class="wrap" id="main-content">

    </div>
    <div class="footer-mark eyebrow">est. 2026</div>
  </div>
</footer>

<script src="posts-data.js"></script>
<script>
  const main = document.getElementById('main-content');

  function renderList() {
    const sorted = [...POSTS].sort((a,b) => b.date.localeCompare(a.date));
    const items = sorted.length ? sorted.map(p => `
      <a class="post-card" href="blog.html?post=${p.slug}">
        <div class="post-meta">${p.date} &middot; ${p.tag}</div>
        <h3>${p.title}</h3>
        <p class="post-excerpt">${p.excerpt}</p>
      </a>
    `).join('') : '<div class="empty-state">No posts yet — the first one is on its way.</div>';

    main.innerHTML = `
      <section style="padding-top:56px;">
        <div class="eyebrow">Writing</div>
        <h1 style="font-size:clamp(28px,4vw,42px); margin-top:10px;">Field notes.</h1>
        <p class="lede" style="max-width:60ch;">Research notes, translation-gap thinking, and the slower record of building a research career across three continents.</p>
      </section>
      <section class="divider-top">
        <div class="card-list">${items}</div>
      </section>
    `;
  }

  function renderPost(slug) {
    const post = POSTS.find(p => p.slug === slug);
    if (!post) { renderList(); return; }
    main.innerHTML = `
      <article class="reader" style="padding-top:56px;">
        <a class="back-link" href="blog.html">&larr; All writing</a>
        <div class="post-meta">${post.date} &middot; ${post.tag}</div>
        <h1>${post.title}</h1>
        <div class="reader-body">${post.body}</div>
      </article>
    `;
    document.title = post.title + ' — Lutfat Abimbola Usman';
  }

  let slug = null;
  try {
    const params = new URLSearchParams(window.location.search);
    slug = params.get('post');
  } catch (e) { slug = null; }
  if (slug) { renderPost(slug); } else { renderList(); }
</script>

</body>
</html>
